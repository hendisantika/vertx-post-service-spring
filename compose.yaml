services:
  postgres:
    image: postgres:18-alpine
    container_name: vertx-post-service-postgres
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d blogdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
